    <text x="303.3333333333333" y="208.0" font-size="12" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">tests on a real PostgreSQL in</text><text x="303.3333333333333" y="224.2" font-size="12" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Cascade's CI</text>
  </g>
  <g>
    <rect x="562.6666666666666" y="126" width="267.3333333333333" height="112" rx="16" fill="url(#card)" stroke="#22d3ee" stroke-opacity=".35"/>
    <rect class="sheen" style="animation-delay:4.5s" x="562.6666666666666" y="126" width="60" height="112" fill="url(#shine)" opacity="0"/>
    <text x="584.6666666666666" y="178" font-size="34" fill="#22d3ee" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">1 of 45</text>
    <text x="584.6666666666666" y="208.0" font-size="12" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">interns, and the only one given a</text><text x="584.6666666666666" y="224.2" font-size="12" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Certificate of Appreciation</text>
  </g>
</g>

