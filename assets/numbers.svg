<svg xmlns="http://www.w3.org/2000/svg" width="830" height="238" viewBox="0 0 830 238" role="img" aria-labelledby="t d">
<title id="t">Numbers I can point to</title>
<desc id="d">6 weeks: from idea to production, ParchiVisa, alone. 4: country eligibility engines running live. 300+: government fleet vehicles on the telemetry layer I built. 30 min to &lt;1 min: reporting latency after my Frontier Works pipelines. 45: tests on a real PostgreSQL in Cascade's CI. 1 of 45: interns, and the only one given a Certificate of Appreciation</desc>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="brandV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171730"/><stop offset="1" stop-color="#0e0e1c"/></linearGradient>
  <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="blur20" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="830" height="238" rx="0"/></clipPath>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<style>
  text{text-rendering:geometricPrecision}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}

    .sheen{animation:sh 6s ease-in-out infinite}
    @keyframes sh{0%{transform:translateX(0);opacity:0}8%{opacity:1}30%{transform:translateX(207.33333333333331px);opacity:0}100%{transform:translateX(207.33333333333331px);opacity:0}}
  </style>
<g clip-path="url(#clip)">


