<svg xmlns="http://www.w3.org/2000/svg" width="830" height="612" viewBox="0 0 830 612" role="img" aria-labelledby="t d">
<title id="t">Four decisions where my first instinct was wrong</title>
<desc id="d">ParchiVisa. First instinct: Weight every criterion and add them up. Evidence: A strong profile with one long unexplained gap came out as a pass. A caseworker would reject it on the gap alone. What I chose: One hard blocker caps the band, whatever the total. The rules live as data. Cascade. First instinct: Treat a provider timeout as a decline. Evidence: A timeout does not say whether the card was charged. Decline it and the customer may pay twice. What I chose: A timeout is an unknown. Save the attempt first and send its id as the idempotency key. VehicleWatch. First instinct: Train a classifier on labelled faults. Evidence: Nobody labels the readings. There was nothing to train on. What I chose: Learn what normal looks like. Isolation Forest and LOF together, because they fail differently. Frontier Works. First instinct: Go after the slow queries. Evidence: The query plans were fine. The requests were waiting for a connection from a drained pool. What I chose: Bound the queries, resize the pool, fail fast. Same peak load, no timeouts.</desc>
