  <text x="32" y="58" font-size="12.5" fill="#70685b" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">Islamabad, Pakistan  ·  UTC+5</text>
  <text x="798" y="58" font-size="12.5" fill="#70685b" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="end" opacity="1">Full stack engineer</text>
  <text x="30" y="142" font-size="54" fill="#1d1c1a" font-weight="700" font-family="Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua','Times New Roman',serif" text-anchor="start" opacity="1">Asad Amad Sheikh</text>
  <line class="under" x1="32" x2="122" y1="164" y2="164" stroke="#b8431f" stroke-width="5" stroke-linecap="butt"/>
  <text x="32" y="204" font-size="25" fill="#1d1c1a" font-weight="400" font-family="Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua','Times New Roman',serif" text-anchor="start" opacity="1" font-style="italic">I ship systems. Then I own them.</text>
  <text x="32" y="230" font-size="16" fill="#b8431f" font-weight="700" font-family="Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua','Times New Roman',serif" text-anchor="start" opacity="1">→</text>
  <text class="proof" style="animation-delay:0s" x="56" y="230" font-size="16" fill="#554f45" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Shipped ParchiVisa alone in six weeks. It is live.</text><text class="proof" style="animation-delay:4s" x="56" y="230" font-size="16" fill="#554f45" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">A timeout is not a decline, and the database enforces it.</text><text class="proof" style="animation-delay:8s" x="56" y="230" font-size="16" fill="#554f45" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Your code, accounts and keys, in your cloud from day one.</text>
  <text x="616" y="84" font-size="13" fill="#554f45" font-weight="400" font-family="Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua','Times New Roman',serif" text-anchor="start" opacity="1" font-style="italic">One request, one owner</text>
  
  <line x1="616" x2="798" y1="98" y2="98" stroke="#d6ccb8"/>
  <text x="638" y="120" font-size="15" fill="#1d1c1a" font-weight="700" font-family="Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua','Times New Roman',serif" text-anchor="start" opacity="1">next.js</text>
  <text x="638" y="136" font-size="11" fill="#70685b" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">intake and report</text>
  <line x1="616" x2="798" y1="144" y2="144" stroke="#d6ccb8"/>
  <text x="638" y="166" font-size="15" fill="#1d1c1a" font-weight="700" font-family="Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua','Times New Roman',serif" text-anchor="start" opacity="1">fastapi</text>
  <text x="638" y="182" font-size="11" fill="#70685b" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">rules decide the verdict</text>
  <line x1="616" x2="798" y1="190" y2="190" stroke="#d6ccb8"/>
  <text x="638" y="212" font-size="15" fill="#1d1c1a" font-weight="700" font-family="Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua','Times New Roman',serif" text-anchor="start" opacity="1">postgres</text>
  <text x="638" y="228" font-size="11" fill="#70685b" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">state</text>
  <line x1="616" x2="798" y1="236" y2="236" stroke="#d6ccb8"/>
  <text x="638" y="258" font-size="15" fill="#1d1c1a" font-weight="700" font-family="Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua','Times New Roman',serif" text-anchor="start" opacity="1">report.pdf</text>
  <text x="638" y="274" font-size="11" fill="#70685b" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">one template, web and PDF</text>
  <line x1="616" x2="798" y1="282" y2="282" stroke="#d6ccb8"/>
  <circle r="4" fill="#b8431f"><animateMotion dur="4s" repeatCount="indefinite" path="M624 120 L624 260"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="4s" repeatCount="indefinite"/></circle>
  <rect x="32" y="268" width="167" height="30" rx="4" fill="none" stroke="#2f6b4f88"/><text x="115.5" y="287.375" font-size="12.5" fill="#2f6b4f" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="middle" opacity="1">ParchiVisa is live</text>
  <circle class="dot" cx="50" cy="283" r="4" fill="#2f6b4f"/>
  <rect x="209" y="268" width="201" height="30" rx="4" fill="none" stroke="#1d1c1a40"/><text x="309.5" y="287.375" font-size="12.5" fill="#1d1c1a" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="middle" opacity="1">Sole engineer, end to end</text>
  <rect x="420" y="268" width="201" height="30" rx="4" fill="none" stroke="#1d1c1a40"/><text x="520.5" y="287.375" font-size="12.5" fill="#1d1c1a" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="middle" opacity="1">Web apps, AI and payments</text>
  <line x1="32" x2="798" y1="312" y2="312" stroke="#1d1c1a" stroke-width="1"/>
  <line x1="32" x2="798" y1="318" y2="318" stroke="#1d1c1a" stroke-width="3"/>

</g>
