<svg xmlns="http://www.w3.org/2000/svg" width="830" height="330" viewBox="0 0 830 330" role="img" aria-labelledby="t d">
<title id="t">Asad Amad Sheikh, Full Stack Engineer</title>
<desc id="d">Profile banner. Asad Amad Sheikh, full stack engineer. I ship systems, then I own them. ParchiVisa is live.</desc>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8431f"/><stop offset="1" stop-color="#b8431f"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf8f1"/><stop offset="1" stop-color="#fbf8f1"/></linearGradient>
  <filter id="glow"><feMerge><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="830" height="330" rx="6"/></clipPath>
  
</defs>
<style>
  text{text-rendering:optimizeLegibility}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}

    .proof{opacity:0;animation:cyc 12s infinite}
    @keyframes cyc{0%{opacity:0}4%,29%{opacity:1}33%,100%{opacity:0}}
    .dot{animation:blink 1.8s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .under{stroke-dasharray:90;animation:ul 6s ease-in-out infinite}
    @keyframes ul{0%{stroke-dashoffset:90}15%,100%{stroke-dashoffset:0}}
  </style>
<g clip-path="url(#clip)">
<rect width="830" height="330" fill="#f3eee3"/>

  <line x1="32" x2="798" y1="26" y2="26" stroke="#1d1c1a" stroke-width="3"/>
