<svg xmlns="http://www.w3.org/2000/svg" width="408" height="300" viewBox="0 0 408 300" role="img" aria-labelledby="t d">
<title id="t">InfluencePay: CLIENT PROJECT, TESTNET</title>
<desc id="d">InfluencePay. Sole engineer. Influencer deals where the budget sits in a smart contract, not in anyone's bank account. Delivered and accepted by the client. Budget locked in escrow before work starts. Disputes hold the money until release or refund. Stack: Solidity, Ethereum, Next.js, Express, Prisma, PostgreSQL.</desc>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
