  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf8f1"/><stop offset="1" stop-color="#fbf8f1"/></linearGradient>
  <filter id="glow"><feMerge><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="830" height="366" rx="6"/></clipPath>
  
</defs>
