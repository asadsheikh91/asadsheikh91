<rect width="830" height="350" fill="#0a0a14"/>

  <rect width="830" height="350" fill="#0a0a14"/>
  
  <circle class="g1" cx="99.6" cy="20" r="110" fill="#8b7cff" opacity=".28" filter="url(#blur40)"/>
  <circle class="g2" cx="788.5" cy="230" r="100" fill="#22d3ee" opacity=".2" filter="url(#blur40)"/>
  <rect width="830" height="350" fill="url(#card)" opacity=".55"/>
  <rect x="28" y="26" width="187" height="26" rx="13" fill="#34d3991f" stroke="#34d39966"/><text x="121.5" y="42.85" font-size="11" fill="#34d399" font-weight="600" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="middle" opacity="1">LIVE PRODUCT, FOUNDER</text>
  <circle class="dot" cx="46" cy="39" r="4" fill="#34d399"/>
  <text x="229" y="44" font-size="11.5" fill="#6d6b8f" font-weight="400" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="start" opacity="1">Founder and sole engineer</text>
  <text x="28" y="94" font-size="44" fill="url(#nm)" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">ParchiVisa</text>
  <text x="28" y="120.0" font-size="15" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">An AI visa-readiness check for students. Designed,</text><text x="28" y="141.8" font-size="15" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">built and shipped alone in six weeks.</text>
