  <rect x="28" y="268" width="58" height="22" rx="11" fill="#ffffff0d" stroke="#ffffff1f"/><text x="57" y="282.675" font-size="10.5" fill="#a09ec0" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="middle" opacity="1">Next.js</text><rect x="92" y="268" width="75" height="22" rx="11" fill="#ffffff0d" stroke="#ffffff1f"/><text x="129.5" y="282.675" font-size="10.5" fill="#a09ec0" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="middle" opacity="1">TypeScript</text><rect x="173" y="268" width="58" height="22" rx="11" fill="#ffffff0d" stroke="#ffffff1f"/><text x="202" y="282.675" font-size="10.5" fill="#a09ec0" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="middle" opacity="1">FastAPI</text><rect x="237" y="268" width="75" height="22" rx="11" fill="#ffffff0d" stroke="#ffffff1f"/><text x="274.5" y="282.675" font-size="10.5" fill="#a09ec0" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="middle" opacity="1">PostgreSQL</text><rect x="318" y="268" width="47" height="22" rx="11" fill="#ffffff0d" stroke="#ffffff1f"/><text x="341.5" y="282.675" font-size="10.5" fill="#a09ec0" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="middle" opacity="1">Redis</text><rect x="371" y="268" width="47" height="22" rx="11" fill="#ffffff0d" stroke="#ffffff1f"/><text x="394.5" y="282.675" font-size="10.5" fill="#a09ec0" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="middle" opacity="1">Clerk</text><rect x="28" y="296" width="75" height="22" rx="11" fill="#ffffff0d" stroke="#ffffff1f"/><text x="65.5" y="310.675" font-size="10.5" fill="#a09ec0" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="middle" opacity="1">Cloudflare</text><rect x="109" y="296" width="92" height="22" rx="11" fill="#ffffff0d" stroke="#ffffff1f"/><text x="155" y="310.675" font-size="10.5" fill="#a09ec0" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="middle" opacity="1">AWS Lightsail</text><rect x="207" y="296" width="53" height="22" rx="11" fill="#ffffff0d" stroke="#ffffff1f"/><text x="233.5" y="310.675" font-size="10.5" fill="#a09ec0" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="middle" opacity="1">Sentry</text>
  
