    <text x="540" y="58" font-size="10" fill="#6d6b8f" font-weight="400" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="start" opacity="1" letter-spacing="1.6">READINESS REPORT</text>
    <circle cx="590" cy="124" r="44" fill="none" stroke="#ffffff14" stroke-width="9"/>
    <circle class="ring" cx="590" cy="124" r="44" fill="none" stroke="#fbbf24" stroke-width="9" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="107.8" transform="rotate(-90 590 124)"/>
