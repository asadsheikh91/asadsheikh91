<svg xmlns="http://www.w3.org/2000/svg" width="408" height="300" viewBox="0 0 408 300" role="img" aria-labelledby="t d">
<title id="t">Veriloom: BUILT, NOT YET DEPLOYED</title>
<desc id="d">Veriloom. Sole engineer. Hiring by real work, with an AI interview that catches outsourced submissions. An LLM grades real deliverables. A follow-up interview keyed to their own submission. A person sees both scores and decides. Stack: Next.js, TypeScript, Express, Prisma, PostgreSQL, Clerk, Cloudflare R2.</desc>
