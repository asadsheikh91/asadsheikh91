  <circle class="g2" cx="387.59999999999997" cy="300" r="100" fill="#22d3ee" opacity=".2" filter="url(#blur40)"/>
  <rect width="408" height="300" fill="url(#card)" opacity=".55"/>
  <rect x="22" y="22" width="176" height="24" rx="12" fill="#34d39922" stroke="#34d39966"/><text x="110" y="37.675" font-size="10.5" fill="#34d399" font-weight="600" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="middle" opacity="1">SOLE ENGINEER, DEMO DATA</text>
  <text x="22" y="78" font-size="29" fill="url(#nm)" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">VehicleWatch</text>
  <text x="210" y="38" font-size="11" fill="#6d6b8f" font-weight="400" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="start" opacity="1">Sole engineer</text>
  <text x="22" y="108.0" font-size="13.2" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Fleet fault detection with no labelled data. It</text><text x="22" y="126.7" font-size="13.2" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">learns what normal looks like.</text>
