<svg xmlns="http://www.w3.org/2000/svg" width="408" height="300" viewBox="0 0 408 300" role="img" aria-labelledby="t d">
<title id="t">VehicleWatch: SOLE ENGINEER, DEMO DATA</title>
<desc id="d">VehicleWatch. Sole engineer. Fleet fault detection with no labelled data. It learns what normal looks like. Scores every sensor reading in under 100 ms. Two anomaly models that fail in different ways. Gemini explains each anomaly in plain English. Stack: FastAPI, PostgreSQL, Redis, scikit-learn, Gemini, Docker.</desc>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="brandV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171730"/><stop offset="1" stop-color="#0e0e1c"/></linearGradient>
  <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="blur20" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="408" height="300" rx="16"/></clipPath>
  
  <linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
</defs>
<style>
  text{text-rendering:geometricPrecision}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}

  .g1{animation:g1 11s ease-in-out infinite}
  .g2{animation:g2 13s ease-in-out infinite}
  @keyframes g1{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,30px)}}
  @keyframes g2{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-24px)}}
  .dot{animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
</style>
