  <rect width="408" height="300" fill="url(#card)" opacity=".55"/>
  <rect x="22" y="22" width="195" height="24" rx="12" fill="#22d3ee22" stroke="#22d3ee66"/><text x="119.5" y="37.675" font-size="10.5" fill="#22d3ee" font-weight="600" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="middle" opacity="1">PERSONAL PROJECT, SIMULATED</text>
  <text x="22" y="78" font-size="29" fill="url(#nm)" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Cascade</text>
