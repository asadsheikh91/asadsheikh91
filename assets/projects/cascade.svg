<title id="t">Cascade: PERSONAL PROJECT, SIMULATED</title>
<desc id="d">Cascade. Sole engineer. A payments backend built around the failure cases. A timeout is not a decline. A retry can never double-charge a customer. Over-refunds blocked by the database itself. 45 tests in CI, on a real PostgreSQL. Stack: C#, .NET, PostgreSQL, Stripe, Shopify, Docker, GitHub Actions.</desc>
