<svg xmlns="http://www.w3.org/2000/svg" width="408" height="300" viewBox="0 0 408 300" role="img" aria-labelledby="t d">
<title id="t">Cascade: PERSONAL PROJECT, SIMULATED</title>
<desc id="d">Cascade. Sole engineer. A payments backend built around the failure cases. A timeout is not a decline. A retry can never double-charge a customer. Over-refunds blocked by the database itself. 45 tests in CI, on a real PostgreSQL. Stack: C#, .NET, PostgreSQL, Stripe, Shopify, Docker, GitHub Actions.</desc>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="brandV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171730"/><stop offset="1" stop-color="#0e0e1c"/></linearGradient>
  <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="blur20" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="408" height="300" rx="16"/></clipPath>
  
  <linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
</defs>
<style>
  text{text-rendering:geometricPrecision}
