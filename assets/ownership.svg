    <rect x="238" y="128" width="170" height="3" rx="1.5" fill="#8b7cff"/>
    <text x="252" y="156" font-size="14.5" fill="#eceaff" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Next.js</text>
    <text x="252" y="174.0" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">TypeScript. Clerk</text><text x="252" y="189.2" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">sign-in. Intake and</text><text x="252" y="204.4" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">report pages</text>
  </g>
  <g class="bx" style="animation-delay:1s">
    <rect x="432" y="128" width="170" height="88" rx="12" fill="url(#card)" stroke="#fbbf24" stroke-opacity=".5"/>
    <rect x="432" y="128" width="170" height="3" rx="1.5" fill="#fbbf24"/>
    <text x="446" y="156" font-size="14.5" fill="#eceaff" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Cloudflare</text>
    <text x="446" y="174.0" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Sits in front of the</text><text x="446" y="189.2" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">API</text>
  </g>
  <g class="bx" style="animation-delay:1.5s">
    <rect x="626" y="128" width="170" height="88" rx="12" fill="url(#card)" stroke="#22d3ee" stroke-opacity=".5"/>
    <rect x="626" y="128" width="170" height="3" rx="1.5" fill="#22d3ee"/>
    <text x="640" y="156" font-size="14.5" fill="#eceaff" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">FastAPI</text>
    <text x="640" y="174.0" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">The service everything</text><text x="640" y="189.2" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">else hangs off</text>
  </g>
  
  <g class="bx" style="animation-delay:0.2s">
    <rect x="44" y="276" width="138" height="138" rx="12" fill="url(#card)" stroke="#8b7cff" stroke-opacity=".5"/>
    <rect x="44" y="276" width="138" height="3" rx="1.5" fill="#8b7cff"/>
    <text x="58" y="304" font-size="14" fill="#eceaff" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Rules engine</text>
    <text x="58" y="322.0" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">UK, Australia,</text><text x="58" y="337.2" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Canada, USA. Rules</text><text x="58" y="352.4" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">kept as data. It</text><text x="58" y="367.5" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">decides the</text><text x="58" y="382.7" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">verdict.</text>
  </g>
  <g class="bx" style="animation-delay:0.7s">
    <rect x="197" y="276" width="138" height="138" rx="12" fill="url(#card)" stroke="#f472b6" stroke-opacity=".5"/>
    <rect x="197" y="276" width="138" height="3" rx="1.5" fill="#f472b6"/>
    <text x="211" y="304" font-size="13.5" fill="#eceaff" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Retrieval + LLM</text>
    <text x="211" y="322.0" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Official</text><text x="211" y="337.2" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">requirements in, a</text><text x="211" y="352.4" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">narrative out. It</text><text x="211" y="367.5" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">cannot change the</text><text x="211" y="382.7" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">verdict.</text>
  </g>
  <g class="bx" style="animation-delay:1.2s">
    <rect x="350" y="276" width="138" height="138" rx="12" fill="url(#card)" stroke="#34d399" stroke-opacity=".5"/>
    <rect x="350" y="276" width="138" height="3" rx="1.5" fill="#34d399"/>
    <text x="364" y="304" font-size="14" fill="#eceaff" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Data layer</text>
    <text x="364" y="322.0" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">PostgreSQL and</text><text x="364" y="337.2" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Redis. I designed</text><text x="364" y="352.4" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">the schema.</text>
  </g>
  <g class="bx" style="animation-delay:1.7s">
    <rect x="503" y="276" width="138" height="138" rx="12" fill="url(#card)" stroke="#22d3ee" stroke-opacity=".5"/>
    <rect x="503" y="276" width="138" height="3" rx="1.5" fill="#22d3ee"/>
    <text x="517" y="304" font-size="14" fill="#eceaff" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Report</text>
    <text x="517" y="322.0" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">One React</text><text x="517" y="337.2" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">template, rendered</text><text x="517" y="352.4" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">to web and PDF</text><text x="517" y="367.5" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">with headless</text><text x="517" y="382.7" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Playwright.</text>
  </g>
  <g class="bx" style="animation-delay:2.2s">
    <rect x="656" y="276" width="138" height="138" rx="12" fill="url(#card)" stroke="#fbbf24" stroke-opacity=".5"/>
    <rect x="656" y="276" width="138" height="3" rx="1.5" fill="#fbbf24"/>
    <text x="670" y="304" font-size="14" fill="#eceaff" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Payment</text>
    <text x="670" y="322.0" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Lives on the same</text><text x="670" y="337.2" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">deploy as intake,</text><text x="670" y="352.4" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">scoring and PDF.</text>
  </g>
  
  <g>
    <rect x="44" y="438" width="358" height="48" rx="12" fill="#fbbf24" fill-opacity=".08" stroke="#fbbf24" stroke-opacity=".5" stroke-dasharray="5 4"/>
    <text x="60" y="459" font-size="13.5" fill="#eceaff" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">AWS Lightsail</text>
    <text x="60" y="476" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">The API and the data run here, behind Cloudflare.</text>
  </g>
  <g>
    <rect x="418" y="438" width="370" height="48" rx="12" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-opacity=".5" stroke-dasharray="5 4"/>
    <text x="434" y="459" font-size="13.5" fill="#eceaff" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Sentry</text>
    <text x="434" y="476" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Watching for errors, so I hear about a failure first.</text>
  </g>
  <circle r="4" fill="#22d3ee" filter="url(#glow)"><animateMotion dur="1.8s" begin="0s" repeatCount="indefinite" path="M216 172 L234 172"/></circle><circle r="4" fill="#22d3ee" filter="url(#glow)"><animateMotion dur="1.8s" begin="0.6s" repeatCount="indefinite" path="M410 172 L428 172"/></circle><circle r="4" fill="#22d3ee" filter="url(#glow)"><animateMotion dur="1.8s" begin="1.2s" repeatCount="indefinite" path="M604 172 L622 172"/></circle>
  <circle r="4" fill="#22d3ee" filter="url(#glow)"><animateMotion dur="3.4s" repeatCount="indefinite" path="M711 216 L711 242 L419 242 L419 274"/></circle>

</g>
