<svg xmlns="http://www.w3.org/2000/svg" width="830" height="528" viewBox="0 0 830 528" role="img" aria-labelledby="t d">
<title id="t">ParchiVisa architecture, owned end to end by one engineer</title>
<desc id="d">A student uses the Next.js app, which calls a FastAPI service behind Cloudflare. The service runs a rules engine for four countries, retrieval plus an LLM that writes the narrative, a PostgreSQL and Redis data layer, a report rendered to web and PDF, and payment. It runs on AWS Lightsail and Sentry watches it. One engineer owns all of it.</desc>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="brandV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171730"/><stop offset="1" stop-color="#0e0e1c"/></linearGradient>
  <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="blur20" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="830" height="528" rx="18"/></clipPath>
  <pattern id="ow" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#ffffff" opacity="0.35"/></pattern>
<radialGradient id="owfade" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="owmask"><rect width="830" height="528" fill="url(#owfade)"/></mask>
</defs>
<style>
  text{text-rendering:geometricPrecision}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}

    .flow{stroke-dasharray:4 7;animation:fl 1.2s linear infinite}
    @keyframes fl{to{stroke-dashoffset:-22}}
    .ring{animation:rg 6s ease-in-out infinite}
    @keyframes rg{0%,100%{stroke-opacity:.35}50%{stroke-opacity:.9}}
    .bx{animation:bx 5s ease-in-out infinite}
    @keyframes bx{0%,100%{opacity:1}50%{opacity:.82}}
  </style>
<g clip-path="url(#clip)">
<rect width="830" height="528" fill="#0a0a14"/>

  <rect width="830" height="528" fill="url(#ow)" mask="url(#owmask)" opacity=".5"/>
  
  <text x="24" y="40" font-size="22" fill="#eceaff" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">ParchiVisa, drawn as the system it is</text>
  <text x="24" y="64" font-size="12.5" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Boxes are from the public case study. The ring is the point: I designed, built, deployed and run every one of them.</text>
  
  <rect class="ring" x="22" y="100" width="786" height="406" rx="20" fill="none" stroke="#8b7cff" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="7 6"/>
  <rect x="38" y="90" width="196" height="22" rx="11" fill="#0a0a14" stroke="#8b7cff" stroke-opacity=".7"/>
  <text x="136" y="105" font-size="10.5" fill="#8b7cff" font-weight="400" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="middle" opacity="1" letter-spacing="1.8">OWNED BY ONE ENGINEER</text>
  <line class="flow" x1="216" y1="172" x2="234" y2="172" stroke="url(#brand)" stroke-width="2"/><path d="M230 168 L236 172 L230 176" fill="none" stroke="#22d3ee" stroke-width="1.6"/><line class="flow" x1="410" y1="172" x2="428" y2="172" stroke="url(#brand)" stroke-width="2"/><path d="M424 168 L430 172 L424 176" fill="none" stroke="#22d3ee" stroke-width="1.6"/><line class="flow" x1="604" y1="172" x2="622" y2="172" stroke="url(#brand)" stroke-width="2"/><path d="M618 168 L624 172 L618 176" fill="none" stroke="#22d3ee" stroke-width="1.6"/>
  
  <path class="flow" d="M711 216 L711 242 L113 242" fill="none" stroke="url(#brand)" stroke-width="2"/>
  <path class="flow" d="M113 242 L113 274" fill="none" stroke="url(#brand)" stroke-width="2"/><path class="flow" d="M266 242 L266 274" fill="none" stroke="url(#brand)" stroke-width="2"/><path class="flow" d="M419 242 L419 274" fill="none" stroke="url(#brand)" stroke-width="2"/><path class="flow" d="M572 242 L572 274" fill="none" stroke="url(#brand)" stroke-width="2"/><path class="flow" d="M725 242 L725 274" fill="none" stroke="url(#brand)" stroke-width="2"/>
  
  <g class="bx" style="animation-delay:0s">
    <rect x="44" y="128" width="170" height="88" rx="12" fill="url(#card)" stroke="#6d6b8f" stroke-opacity=".5"/>
    <rect x="44" y="128" width="170" height="3" rx="1.5" fill="#6d6b8f"/>
    <text x="58" y="156" font-size="14.5" fill="#eceaff" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Student</text>
    <text x="58" y="174.0" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">Opens the app in a</text><text x="58" y="189.2" font-size="11" fill="#a09ec0" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="start" opacity="1">browser</text>
  </g>
  <g class="bx" style="animation-delay:0.5s">
