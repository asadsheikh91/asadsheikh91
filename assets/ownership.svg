  <text x="138" y="105" font-size="13.5" fill="#2d4b6e" font-weight="700" font-family="Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua','Times New Roman',serif" text-anchor="middle" opacity="1" font-style="italic">Owned by one engineer</text>
