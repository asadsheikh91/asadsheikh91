<svg xmlns="http://www.w3.org/2000/svg" width="830" height="408" viewBox="0 0 830 408" role="img" aria-labelledby="t d">
<title id="t">Working hours across time zones</title>
<desc id="d">Core hours are 5 pm to 3 am Islamabad time, which is 12:00 to 22:00 UTC. In New York and Toronto standard time that is 07:00 to 17:00, a full 9 to 5 day. In London 12:00 to 22:00, in Vancouver 04:00 to 14:00, in Dubai 16:00 to 02:00.</desc>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8431f"/><stop offset="1" stop-color="#b8431f"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf8f1"/><stop offset="1" stop-color="#fbf8f1"/></linearGradient>
  <filter id="glow"><feMerge><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="830" height="408" rx="16"/></clipPath>
  
</defs>
<style>
  text{text-rendering:optimizeLegibility}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}

    .band{animation:bd 4s ease-in-out infinite}
    @keyframes bd{0%,100%{opacity:.92}50%{opacity:.62}}
  </style>
<g clip-path="url(#clip)">
<rect width="830" height="408" fill="#f3eee3"/>

  <text x="24" y="40" font-size="22" fill="#1d1c1a" font-weight="800" font-family="Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua','Times New Roman',serif" text-anchor="start" opacity="1">My core hours: 5 pm to 3 am Islamabad time</text>
  <text x="24" y="62" font-size="12.5" fill="#554f45" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">Each row is that city's own clock. The dashed outline is a 9 to 5 day. Core hours, not limits.</text><line x1="174" y1="90" x2="174" y2="346" stroke="#1d1c1a10"/><text x="174" y="82" font-size="10" fill="#70685b" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="middle" opacity="1">00:00</text><line x1="300.5" y1="90" x2="300.5" y2="346" stroke="#1d1c1a10"/><text x="300.5" y="82" font-size="10" fill="#70685b" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="middle" opacity="1">06:00</text><line x1="427" y1="90" x2="427" y2="346" stroke="#1d1c1a10"/><text x="427" y="82" font-size="10" fill="#70685b" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="middle" opacity="1">12:00</text><line x1="553.5" y1="90" x2="553.5" y2="346" stroke="#1d1c1a10"/><text x="553.5" y="82" font-size="10" fill="#70685b" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="middle" opacity="1">18:00</text><line x1="680" y1="90" x2="680" y2="346" stroke="#1d1c1a10"/><text x="680" y="82" font-size="10" fill="#70685b" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="middle" opacity="1">00:00</text>
  <g>
    <text x="24" y="121" font-size="13.5" fill="#1d1c1a" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">Vancouver</text>
    <text x="24" y="137" font-size="10" fill="#70685b" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">PST, UTC-8</text>
    <rect x="174" y="104" width="506" height="26" rx="3" fill="#1d1c1a0b" stroke="#1d1c1a14"/>
    <rect x="363.75" y="101" width="168.66666666666674" height="32" rx="3" fill="none" stroke="#a5701a" stroke-opacity=".55" stroke-dasharray="4 3"/>
    <rect class="band" x="258.3333333333333" y="104" width="210.83333333333337" height="26" rx="3" fill="url(#brand)" opacity=".9"/>
    <text x="694" y="122" font-size="12" fill="#1d1c1a" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">04:00 to 14:00</text>
    <text x="694" y="137" font-size="10" fill="#2f6b4f" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">5 h of your 9 to 5</text>
  </g>
  <g>
    <text x="24" y="173" font-size="13.5" fill="#1d1c1a" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">New York, Toronto</text>
    <text x="24" y="189" font-size="10" fill="#70685b" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">EST, UTC-5</text>
    <rect x="174" y="156" width="506" height="26" rx="3" fill="#1d1c1a0b" stroke="#1d1c1a14"/>
    <rect x="363.75" y="153" width="168.66666666666674" height="32" rx="3" fill="none" stroke="#a5701a" stroke-opacity=".55" stroke-dasharray="4 3"/>
    <rect class="band" x="321.58333333333337" y="156" width="210.83333333333337" height="26" rx="3" fill="url(#brand)" opacity=".9"/>
    <text x="694" y="174" font-size="12" fill="#1d1c1a" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">07:00 to 17:00</text>
    <text x="694" y="189" font-size="10" fill="#2f6b4f" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">8 h of your 9 to 5</text>
  </g>
  <g>
    <text x="24" y="225" font-size="13.5" fill="#1d1c1a" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">London</text>
    <text x="24" y="241" font-size="10" fill="#70685b" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">GMT, UTC+0</text>
    <rect x="174" y="208" width="506" height="26" rx="3" fill="#1d1c1a0b" stroke="#1d1c1a14"/>
    <rect x="363.75" y="205" width="168.66666666666674" height="32" rx="3" fill="none" stroke="#a5701a" stroke-opacity=".55" stroke-dasharray="4 3"/>
    <rect class="band" x="427" y="208" width="210.83333333333326" height="26" rx="3" fill="url(#brand)" opacity=".9"/>
    <text x="694" y="226" font-size="12" fill="#1d1c1a" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">12:00 to 22:00</text>
    <text x="694" y="241" font-size="10" fill="#2f6b4f" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">5 h of your 9 to 5</text>
  </g>
  <g>
    <text x="24" y="277" font-size="13.5" fill="#1d1c1a" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">Dubai</text>
    <text x="24" y="293" font-size="10" fill="#70685b" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">GST, UTC+4</text>
    <rect x="174" y="260" width="506" height="26" rx="3" fill="#1d1c1a0b" stroke="#1d1c1a14"/>
    <rect x="363.75" y="257" width="168.66666666666674" height="32" rx="3" fill="none" stroke="#a5701a" stroke-opacity=".55" stroke-dasharray="4 3"/>
    <rect class="band" x="511.3333333333333" y="260" width="168.66666666666669" height="26" rx="3" fill="url(#brand)" opacity=".9"/><rect class="band" x="174" y="260" width="42.16666666666666" height="26" rx="3" fill="url(#brand)" opacity=".9"/>
    <text x="694" y="278" font-size="12" fill="#1d1c1a" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">16:00 to 02:00</text>
    <text x="694" y="293" font-size="10" fill="#2f6b4f" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">1 h of your 9 to 5</text>
  </g>
  <g>
    <text x="24" y="329" font-size="13.5" fill="#b8431f" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">Islamabad</text>
    <text x="24" y="345" font-size="10" fill="#70685b" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">PKT, UTC+5</text>
    <rect x="174" y="312" width="506" height="26" rx="3" fill="#1d1c1a0b" stroke="#1d1c1a14"/>
    <rect x="363.75" y="309" width="168.66666666666674" height="32" rx="3" fill="none" stroke="#a5701a" stroke-opacity=".55" stroke-dasharray="4 3"/>
    <rect class="band" x="532.4166666666667" y="312" width="147.58333333333326" height="26" rx="3" fill="url(#brand)" opacity=".9"/><rect class="band" x="174" y="312" width="63.25" height="26" rx="3" fill="url(#brand)" opacity=".9"/>
    <text x="694" y="330" font-size="12" fill="#1d1c1a" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">17:00 to 03:00</text>
    <text x="694" y="345" font-size="10" fill="#70685b" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">your evening</text>
  </g><text x="24" y="390" font-size="10" fill="#70685b" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="start" opacity="1">Standard time. Daylight saving moves the western rows by one hour. Cities listed are examples, not a limit.</text>
</g>
<rect x=".5" y=".5" width="829" height="407" rx="16" fill="none" stroke="#d6ccb8"/>
</svg>
