<svg xmlns="http://www.w3.org/2000/svg" width="830" height="624" viewBox="0 0 830 624" role="img" aria-labelledby="t d">
<title id="t">How I ship a system, in eight steps</title>
<desc id="d">01 Validate: Talk to users and build a scoring prototype before a full build. Receipt: ParchiVisa: validated first, then live in six weeks. 02 Model: Schema and rules first. Business rules live as data, not code branches. Receipt: Four country engines run on rules kept as data. 03 Build: One thin slice, end to end, before anything gets polished. Receipt: ParchiVisa intake, scoring, PDF and payment run with no manual steps. 04 Break: Write the failure cases early: timeouts, duplicates, retries, over-refunds. Receipt: Cascade: 45 tests, integration tests on a real PostgreSQL. 05 Ship: Docker, CI, one deploy. A live preview from week one, weekly written updates. Receipt: Cascade: Docker plus CI on GitHub Actions. 06 Run: Monitor it, fix it fast. As sole engineer, nobody else to hand a failure to. Receipt: ParchiVisa: AWS Lightsail behind Cloudflare, watched by Sentry. 07 Hand over: Code, accounts and keys sit in your own GitHub and cloud from day one. Receipt: Two weeks of fixes after launch are in the quoted price. 08 Write it down: Say what the project does not do yet, in public, next to what it does. Receipt: Every case study on my site has an Honest limits section.</desc>
