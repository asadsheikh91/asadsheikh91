<desc id="d">B.S. Computer Science at FAST NUCES from 2022, graduated June 2026. Data engineering intern at Ufone, June to August 2024. Backend engineering intern at Frontier Works, June to August 2025, the only Certificate of Appreciation among 45 interns. Founder of ParchiVisa, 2026 to now. In 2026: first commits of Veriloom in March, VehicleWatch in April and InfluencePay in May, graduation in June, first commit of Cascade in September.</desc>
